name: wifi_p2p_app
description: "تطبيق الاتصالات المحلي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. مكتبات الهوية والتشفير والتخزين
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # 2. الصوت والأذونات
  audioplayers: ^6.0.0
  permission_handler: ^11.0.0

  # 3. خدمات الخلفية والشبكة والاتصال
  flutter_webrtc: ^0.9.48
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
