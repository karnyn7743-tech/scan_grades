name: wifi_p2p_app
description: "تطبيق محادثة ومكالمات عبر الشبكة المحلية P2P بدون إنترنت"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # حزمة مكالمات الفيديو والصوت
  flutter_webrtc: ^0.9.48
  
  # إدارة الأذونات (الكاميرا، الميكروفون، والشبكة)
  permission_handler: ^11.3.1
  
  # اكتشاف الأجهزة عبر الشبكة المحلية (mDNS / NSD)
  nsd: ^5.0.1
  
  # التخزين الآمن لمعرفات الأجهزة الموثوقة
  flutter_secure_storage: ^9.0.0
  
  # توليد معرّف فريد للجهاز (UUID)
  uuid: ^4.3.3
  
  # أيقونات إضافية للواجهة
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
   
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
